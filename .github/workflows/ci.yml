name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Non-blocking: 3 known high-severity advisories (postcss, sharp) live
      # inside next's own dependency tree, not anything this repo controls.
      # next is already on its latest release; there's no upgrade path that
      # fixes them without a fake "fix" (forcing next down to a 9.x major).
      # Still runs so the report shows in CI logs — revisit and re-enable
      # blocking once a next release resolves them upstream.
      - run: npm run audit
        continue-on-error: true

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run format:check

      - run: npm run build
