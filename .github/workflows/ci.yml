name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run audit

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run format:check

      # The photos and video pages fetch from the CMS at build time.
      - run: npm run build
        env:
          CMS_API_URL: https://api.yxyang.space
